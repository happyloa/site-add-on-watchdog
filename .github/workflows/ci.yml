name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run PHPCS
        if: matrix.php-version == '8.5'
        run: vendor/bin/phpcs
      - name: Run PHPUnit
        run: vendor/bin/phpunit

  package:
    name: Build release package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build WordPress release ZIP
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version 1.9.0
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: site-add-on-watchdog-1.9.0
          path: dist/site-add-on-watchdog-1.9.0.zip
          if-no-files-found: error

  plugin-check:
    name: WordPress Plugin Check
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: site-add-on-watchdog-1.9.0
          path: dist
      - name: Extract release package
        run: unzip -q dist/site-add-on-watchdog-1.9.0.zip -d dist/plugin-check
      - name: Run official WordPress checks
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/plugin-check/site-add-on-watchdog
          strict: true
          include-experimental: false
      - name: Verify WordPress version and packaged scan
        run: |
          wp-env run cli wp eval 'if (version_compare(get_bloginfo("version"), "7.1.3", "<") || version_compare(get_bloginfo("version"), "7.2", ">=")) { WP_CLI::error("Expected WordPress 7.1.3 or a newer 7.1 patch release."); }'
          wp-env run cli wp watchdog scan --notify=false
          wp-env run cli wp eval 'if (get_transient("siteadwa_scan_error") || ! get_option("siteadwa_risk_history")) { WP_CLI::error("The scan did not save its results."); }'
      - name: Verify packaged email delivery through SMTP
        run: |
          cli_container=$(docker ps --filter label=com.docker.compose.service=cli --format '{{.ID}}' | head -n 1)
          test -n "$cli_container"
          network=$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$cli_container")
          docker run --detach --rm --name watchdog-mailpit-190 --network "$network" axllent/mailpit:latest
          docker cp source/tests/integration/email-smoke.php "$cli_container:/tmp/watchdog-email-smoke.php"
          wp-env run cli wp config set WP_ENVIRONMENT_TYPE local --type=constant
          wp-env run cli wp eval-file /tmp/watchdog-email-smoke.php
      - name: Stop SMTP test service
        if: always()
        run: docker rm --force watchdog-mailpit-190 || true
